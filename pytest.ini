[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=75
markers =
    unit: Unit tests (no I/O)
    integration: Integration tests (mocked I/O)
    slow: Tests that take >1s
