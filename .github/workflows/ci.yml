name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup ephemeris
        run: |
          python - <<EOF
          from skyfield.api import load
          load('de421.bsp')
          EOF

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          APP_ENV: testing
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Create dummy ephemeris file
        run: touch de421.bsp

      - name: Build Docker image
        run: docker build -t astro-time-machine:ci .

      - name: Verify image runs
        run: |
          docker run --rm -d --name astro_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -p 8000:8000 astro-time-machine:ci
          sleep 5
          docker stop astro_test || true
